# Copy this file into YOUR code repo at: .github/workflows/code-review-on-demand.yml
# Review a PR on demand: type `/review` as a comment on the PR, or run manually
# from the Actions tab and enter a PR number.
name: Code Review (on demand)

on:
  workflow_dispatch:
    inputs:
      pr_number:
        description: "PR number to review"
        required: true
  issue_comment:
    types: [created]

permissions:
  contents: read
  pull-requests: write

jobs:
  review:
    if: >
      github.event_name == 'workflow_dispatch' ||
      (github.event.issue.pull_request && contains(github.event.comment.body, '/review'))
    runs-on: ubuntu-latest
    steps:
      - uses: donglnp/agent-code-reviewer@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          pr_number: ${{ github.event.inputs.pr_number || github.event.issue.number }}
