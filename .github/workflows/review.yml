# Example: run the reviewer on every PR in THIS repo (dogfooding).
# To use the action in another repo, copy a workflow like this and replace
# `./` with `donglnp/agent-code-reviewer@v1` (or your published ref).
name: Code Review

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write

jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          # Optional tuning:
          # model: claude-opus-4-8
          # effort: high
          # min_severity: low
          # exclude: |
          #   *.lock
          #   dist/**
          #   **/*.snap
